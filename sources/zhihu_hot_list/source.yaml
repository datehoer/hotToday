key: zhihu_hot_list
name: 知乎热榜
enabled: true
schedule: hourly
timeout: 30s
retries: 4
proxy: subpool

fetch:
  type: json
  url: https://www.zhihu.com/api/v3/feed/topstory/hot-list-web?limit=50&desktop=true
  headers:
    User-Agent: "{ua.desktop}"
  impersonate: chrome

extract:
  list: $
  fields:
    title: target.title_area.text ?? target.title
    url: target.link.url ?? target.url
    heat: target.metrics_area.text ?? detail_text
